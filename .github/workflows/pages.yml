name: Check and deploy personal navigation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/zzp-home validate
      - run: go run ./cmd/zzp-home build
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tests/*.test.js
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install headless browsers
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.{list,sources}; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$apt_source"
            fi
          done
          npx playwright install --with-deps --only-shell chromium webkit
      - run: node scripts/browser-check.cjs
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked navigation
        id: deployment
        uses: actions/deploy-pages@v5
